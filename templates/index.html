<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Feeder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <div class="icon">🐱</div>
        <h1>Smart Cat Feeder</h1>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('feeder')">Feeder</button>
            <button class="tab" onclick="switchTab('presence')">Presence</button>
            <button class="tab" onclick="switchTab('system')">System</button>
            <button class="tab" onclick="switchTab('schedule')">Schedule</button>
        </div>

        <div id="tab-feeder" class="tab-content active">
            <div class="controls">
                <div class="input-group">
                    <label for="rotation">Steps</label>
                    <input id="rotation" type="number" value="50" step="1" min="1">
                    <span>steps</span>
                </div>

                <button class="btn btn-rotate" onclick="rotateMotor()">
                    ↻ Rotate
                </button>

                <div class="btn-row">
                    <button class="btn btn-open" onclick="openMotor()">
                        ▲ Open
                    </button>
                    <button class="btn btn-close" onclick="closeMotor()">
                        ▼ Close
                    </button>
                </div>
            </div>

            <div id="motor-status" class="status idle">Ready</div>
        </div>

        <div id="tab-presence" class="tab-content">
            <div class="presence-indicator" id="presence-dot">
                <span class="dot"></span>
                <span id="presence-label">No presence</span>
            </div>

            <div class="graph-container">
                <canvas id="presence-graph"></canvas>
            </div>
            <div class="graph-labels">
                <span>2m ago</span>
                <span>now</span>
            </div>
        </div>

        <div id="tab-system" class="tab-content">
            <div class="stat-row">
                <span class="stat-label">CPU</span>
                <div class="bar-bg">
                    <div id="cpu-bar" class="bar-fill cpu" style="width:0%"></div>
                </div>
                <span id="cpu-text" class="stat-value">—</span>
            </div>

            <div class="stat-row">
                <span class="stat-label">RAM</span>
                <div class="bar-bg">
                    <div id="ram-bar" class="bar-fill ram" style="width:0%"></div>
                </div>
                <span id="ram-text" class="stat-value">—</span>
            </div>

            <div class="stat-row">
                <span class="stat-label">Temp</span>
                <span id="temp-text" class="stat-value" style="flex:1;text-align:right">—</span>
            </div>

            <div class="stat-row">
                <span class="stat-label">Time</span>
                <span id="time-text" class="stat-value" style="flex:1;text-align:right">—</span>
            </div>

            <div class="stat-row">
                <span class="stat-label">Uptime</span>
                <span id="uptime-text" class="stat-value" style="flex:1;text-align:right">—</span>
            </div>
        </div>

        <div id="tab-schedule" class="tab-content">
            <div class="schedule-add">
                <input id="schedule-time" type="time" class="time-input" value="08:00">
                <input id="schedule-rotation" type="number" value="50" min="1" class="rot-input">
                <button class="btn btn-add" onclick="addSchedule()">+</button>
            </div>
            <div id="schedule-list" class="schedule-list"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
