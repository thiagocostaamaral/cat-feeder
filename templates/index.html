<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Feeder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <div class="icon">🐱</div>
        <h1>Smart Cat Feeder</h1>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('feeder')">Feeder</button>
            <button class="tab" onclick="switchTab('presence')">Presence</button>
            <button class="tab" onclick="switchTab('system')">System</button>
            <button class="tab" onclick="switchTab('auto')">Auto</button>
            <button class="tab" onclick="switchTab('photos')">Photos</button>
            <button class="tab" onclick="switchTab('weight')">Weight</button>
        </div>

        <div id="tab-feeder" class="tab-content active">
            <div class="motor-select">
                <button class="m-btn active" data-motor="1" onclick="selectMotor(1)">Motor 1</button>
                <button class="m-btn" data-motor="2" onclick="selectMotor(2)">Motor 2</button>
            </div>

            <div class="controls">
                <div class="input-group">
                    <label for="rotation">Steps</label>
                    <input id="rotation" type="number" value="50" step="1" min="1">
                    <span>steps</span>
                </div>

                <button class="btn btn-rotate" onclick="rotateMotor()">
                    ↻ Rotate
                </button>

                <div class="btn-row">
                    <button class="btn btn-open" onclick="openMotor()">
                        ▲ Open
                    </button>
                    <button class="btn btn-close" onclick="closeMotor()">
                        ▼ Close
                    </button>
                </div>
            </div>

            <div id="motor-status" class="status idle">Motor 1 · Ready</div>
        </div>

        <div id="tab-presence" class="tab-content">
            <div class="presence-indicator" id="presence-dot">
                <span class="dot"></span>
                <span id="presence-label">No presence</span>
            </div>

            <div class="graph-container">
                <canvas id="presence-graph"></canvas>
            </div>
            <div class="graph-labels">
                <span>2m ago</span>
                <span>now</span>
            </div>
        </div>

        <div id="tab-system" class="tab-content">
            <div class="stat-row">
                <span class="stat-label">CPU</span>
                <div class="bar-bg">
                    <div id="cpu-bar" class="bar-fill cpu" style="width:0%"></div>
                </div>
                <span id="cpu-text" class="stat-value">—</span>
            </div>

            <div class="stat-row">
                <span class="stat-label">RAM</span>
                <div class="bar-bg">
                    <div id="ram-bar" class="bar-fill ram" style="width:0%"></div>
                </div>
                <span id="ram-text" class="stat-value">—</span>
            </div>

            <div class="stat-row">
                <span class="stat-label">Temp</span>
                <span id="temp-text" class="stat-value" style="flex:1;text-align:right">—</span>
            </div>

            <div class="stat-row">
                <span class="stat-label">Time</span>
                <span id="time-text" class="stat-value" style="flex:1;text-align:right">—</span>
            </div>

            <div class="stat-row">
                <span class="stat-label">Uptime</span>
                <span id="uptime-text" class="stat-value" style="flex:1;text-align:right">—</span>
            </div>
        </div>

        <div id="tab-auto" class="tab-content">
            <div id="auto-status" class="status idle">Auto · —</div>

            <div class="stat-row" style="margin-top:16px">
                <span class="stat-label">Now</span>
                <span id="auto-weight" class="stat-value" style="flex:1;text-align:right">—</span>
            </div>

            <div class="controls">
                <div class="input-group">
                    <label for="auto-low">Refill below</label>
                    <input id="auto-low" type="number" value="10" step="1" min="0"
                           onchange="saveAutoField()">
                    <span>g</span>
                </div>

                <div class="input-group">
                    <label for="auto-target">Fill to</label>
                    <input id="auto-target" type="number" value="40" step="1" min="1"
                           onchange="saveAutoField()">
                    <span>g</span>
                </div>

                <button class="btn btn-open" id="auto-toggle" onclick="toggleAuto()">Disable</button>

                <div class="btn-row">
                    <button class="btn btn-open" onclick="doseOnce()">▶ Dose once</button>
                    <button class="btn btn-close" onclick="stopAuto()">■ Stop</button>
                </div>
            </div>

            <div id="auto-events" class="event-list"></div>
            <div id="auto-gps" class="history-note">—</div>
        </div>

        <div id="tab-photos" class="tab-content">
            <div id="photos-grid" class="photos-grid"></div>
        </div>

        <div id="tab-weight" class="tab-content">
            <div class="weight-display">
                <span id="weight-grams" class="weight-value">—</span>
                <span class="weight-unit">g</span>
            </div>

            <div id="weight-status" class="status idle">Scale · —</div>

            <div class="controls">
                <button class="btn btn-open" onclick="tareScale()">
                    ⟲ Tare
                </button>
                <a class="btn btn-rotate" href="/configure">⚙ Configure</a>
            </div>

            <div class="graph-container" style="margin-top:16px">
                <canvas id="weight-history"></canvas>
            </div>
            <div class="graph-labels">
                <span id="history-range">no samples yet</span>
                <span>now</span>
            </div>
            <div class="history-note">every 10 min · every 10 s while presence is detected</div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
